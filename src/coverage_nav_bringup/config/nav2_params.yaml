# =============================================================================
# Nav2 参数配置文件
# 适配: FASTLIO2_ROS2 定位 + 麦轮底盘 + opennav_coverage
#
# TF 约定 (FASTLIO2 → Nav2 对齐):
#   FASTLIO2 默认输出: camera_init → body
#   Nav2 期望:         map → odom → base_link
#
#   如果你的 FASTLIO2 已经配置输出 map/odom/base_link，则无需修改。
#   否则需要在 launch 文件中添加 static_transform_publisher 做帧名桥接。
#   参考 launch/navigation.launch.py 中的说明。
# =============================================================================

# -----------------------------------------------------------------------------
# BT Navigator — 行为树导航器
# 集成三个导航插件: 单点导航 / 多点导航 / 覆盖导航
# -----------------------------------------------------------------------------
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map              # 与 FASTLIO2 固定帧对齐 (camera_init → map)
    robot_base_frame: base_link    # 与 FASTLIO2 机器人帧对齐 (body → base_link)
    odom_topic: /odom              # FASTLIO2 里程计 topic (默认 /Odometry → 需 remap)
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0

    # 导航器插件列表
    navigators:
      - navigate_to_pose
      - navigate_through_poses
      - coverage               # opennav_coverage 覆盖导航插件

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    coverage:
      plugin: "opennav_coverage::CoverageNavigator"

    # BT 插件库 (保持完整列表)
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_remove_in_collision_goals_action_bt_node

# -----------------------------------------------------------------------------
# Controller Server — 局部轨迹跟踪控制器
# 使用 MPPI + Omni 运动模型，专为麦轮全向底盘设计
# -----------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0          # 控制频率 (Hz)
    min_x_velocity_threshold: 0.001     # 前进速度死区
    min_y_velocity_threshold: 0.001     # 横移速度死区 (麦轮必须开放)
    min_theta_velocity_threshold: 0.001 # 旋转速度死区
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # 进度检查器: 检测机器人是否卡死
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3     # 允许时间内最小移动距离 (m)
      movement_time_allowance: 10.0     # 允许停滞时间 (s)

    # 目标到达判断
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10           # 位置容差 (m), 覆盖任务可适当放宽
      yaw_goal_tolerance: 0.15          # 角度容差 (rad), 约 8.6°

    # ==========================================================================
    # MPPI Controller — 推荐用于麦轮全向运动
    # motion_model: Omni 是麦轮的关键配置
    # ==========================================================================
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # 轨迹采样参数
      time_steps: 56                    # 预测时域步数
      model_dt: 0.05                    # 时间步长 (s) → 预测 2.8s
      batch_size: 2000                  # 并行采样轨迹数 (越大越好，越慢)
      iteration_count: 1

      # 速度噪声标准差 (探索范围)
      vx_std: 0.2
      vy_std: 0.2                       # 横移速度噪声 (麦轮专属)
      wz_std: 0.4

      # 速度限制 — 根据你的麦轮底盘实际性能调整
      vx_max: 0.5                       # 最大前进速度 (m/s)
      vx_min: -0.5                      # 最大后退速度 (m/s)
      vy_max: 0.5                       # 最大横移速度 (m/s)  ← 麦轮核心参数
      wz_max: 1.0                       # 最大角速度 (rad/s)

      # 加速度限制
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5

      # *** 关键参数: 全向运动模型 (麦轮必须设为 Omni) ***
      motion_model: "Omni"

      # 优化参数
      temperature: 0.3
      gamma: 0.015
      prune_distance: 1.7
      transform_tolerance: 0.1
      visualize: false                  # 调试时可设为 true，发布候选轨迹

      # 评价函数 (Critics) — 控制轨迹评分权重
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      # 覆盖作业时机器人通常需要前进，保持适度的前向偏好
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0              # 适当降低，允许麦轮横移

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0                       # 0=前向对齐, 1=双向, 2=不关心朝向

# -----------------------------------------------------------------------------
# Planner Server — 全局路径规划器
# 在 opennav_coverage 模式下用于局部避障重规划
# -----------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false              # false=Dijkstra, true=A*
      allow_unknown: true

# -----------------------------------------------------------------------------
# Smoother Server — 路径平滑器
# -----------------------------------------------------------------------------
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# -----------------------------------------------------------------------------
# Behavior Server — 恢复行为
# 机器人卡死时的应急动作 (旋转/后退/等待)
# -----------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# -----------------------------------------------------------------------------
# Velocity Smoother — 速度平滑器
# 防止速度突变，保护麦轮电机
# -----------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # [vx, vy, wz] — 麦轮三轴都需要配置
    max_velocity: [0.5, 0.5, 1.0]
    min_velocity: [-0.5, -0.5, -1.0]
    max_accel: [2.5, 2.5, 3.2]
    max_decel: [-2.5, -2.5, -3.2]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# -----------------------------------------------------------------------------
# Waypoint Follower — 路径点跟随
# opennav_coverage 会通过 NavigateThroughPoses 调用此模块
# -----------------------------------------------------------------------------
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false          # 覆盖任务: 单点失败后继续
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0    # 覆盖作业通常不需要在路径点停留

# -----------------------------------------------------------------------------
# Global Costmap — 全局代价地图
# 基于静态地图 + 激光雷达障碍物更新
# -----------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      # *** 根据你的机器人实际尺寸修改 ***
      robot_radius: 0.30            # 机器人外接圆半径 (m)
      resolution: 0.05              # 地图分辨率 (m/cell), 与保存的2D地图一致
      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan              # 激光雷达 scan topic，根据实际修改
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40      # 膨胀半径 (m), 建议略大于 robot_radius

      always_send_full_costmap: true

# -----------------------------------------------------------------------------
# Local Costmap — 局部代价地图 (滚动窗口)
# 用于实时避障
# -----------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3                      # 局部地图宽度 (m)
      height: 3                     # 局部地图高度 (m)
      resolution: 0.05
      robot_radius: 0.30

      plugins:
        - voxel_layer
        - inflation_layer

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40

      always_send_full_costmap: true

# -----------------------------------------------------------------------------
# Map Server — 静态地图加载
# yaml_filename 在 launch 文件中动态传入
# -----------------------------------------------------------------------------
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""               # 由 launch 文件的 map_yaml_file 参数覆盖

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# -----------------------------------------------------------------------------
# Lifecycle Manager — 节点生命周期管理
# 按顺序激活/去激活 Nav2 组件
# -----------------------------------------------------------------------------
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 4.0
    attempt_reconnect_timeout: 2000
    bond_heartbeat_period: 0.1
    node_names:
      - map_server
      - planner_server
      - smoother_server
      - controller_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
